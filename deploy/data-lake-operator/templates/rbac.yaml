{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "data-lake-operator.fullname" . }}-manager
  labels:
    {{- include "data-lake-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - datalake.opsarray.io
    resources:
      - datalakes
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - datalake.opsarray.io
    resources:
      - datalakes/finalizers
    verbs:
      - update
  - apiGroups:
      - datalake.opsarray.io
    resources:
      - datalakes/status
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "data-lake-operator.fullname" . }}-manager
  labels:
    {{- include "data-lake-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "data-lake-operator.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "data-lake-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election coordinates the active replica within the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "data-lake-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-lake-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "data-lake-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-lake-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "data-lake-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "data-lake-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if and .Values.metrics.enabled .Values.metrics.secure }}
---
# Secure metrics delegate authn/authz to the API server, which requires the
# manager to be able to create token and access reviews.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "data-lake-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "data-lake-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "data-lake-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "data-lake-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "data-lake-operator.fullname" . }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "data-lake-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Grants the ability to scrape the metrics endpoint. Bind this to whichever
# identity your monitoring stack scrapes with.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "data-lake-operator.fullname" . }}-metrics-reader
  labels:
    {{- include "data-lake-operator.labels" . | nindent 4 }}
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
{{- end }}
{{- end }}

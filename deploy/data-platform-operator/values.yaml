# Default values for data-platform-operator.

# The operator uses leader election, so extra replicas are warm standbys rather
# than additional reconcile throughput. Only one is active at a time.
replicaCount: 1

image:
  repository: ghcr.io/opsarrayllc/data-platform-operator
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion when empty.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

crds:
  # Install the DataPlatform CustomResourceDefinition as part of the release.
  # Disable this if you manage CRDs out of band (e.g. via kustomize or ArgoCD).
  enabled: true
  # Keep the CRD when the release is uninstalled. Deleting a CRD deletes every
  # DataPlatform in the cluster, so this defaults to keeping it.
  keep: true

serviceAccount:
  create: true
  automount: true
  annotations: {}
  # Defaults to the fullname template when empty.
  name: ""

rbac:
  # Create the ClusterRole/ClusterRoleBinding the manager needs to reconcile
  # DataPlatform resources, plus the namespaced Role used for leader election.
  create: true

leaderElection:
  enabled: true

metrics:
  # Serve controller-runtime metrics.
  enabled: true
  # Bind over HTTPS and require authn/authz on the metrics endpoint. When true
  # the scraper must present a token authorized against the metrics-reader role.
  secure: true
  port: 8443
  service:
    type: ClusterIP
  serviceMonitor:
    # Requires the Prometheus Operator CRDs to be present in the cluster.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    # Self-signed metrics certs are generated by controller-runtime, so
    # verification is off by default. Point tlsConfig at a real CA in production.
    insecureSkipVerify: true

healthProbe:
  port: 8081

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# Extra arguments appended to the manager command line.
extraArgs: []

# Extra environment variables for the manager container.
env: []

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

terminationGracePeriodSeconds: 10

priorityClassName: ""

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - dataplatform.opsarray.io
  resources:
  - datalakes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dataplatform.opsarray.io
  resources:
  - datalakes/finalizers
  verbs:
  - update
- apiGroups:
  - dataplatform.opsarray.io
  resources:
  - datalakes/status
  verbs:
  - get
  - patch
  - update

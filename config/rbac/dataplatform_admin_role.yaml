# This rule is not used by the project data-platform-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over dataplatform.opsarray.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: data-platform-operator
    app.kubernetes.io/managed-by: kustomize
  name: dataplatform-admin-role
rules:
- apiGroups:
  - dataplatform.opsarray.io
  resources:
  - dataplatforms
  verbs:
  - '*'
- apiGroups:
  - dataplatform.opsarray.io
  resources:
  - dataplatforms/status
  verbs:
  - get

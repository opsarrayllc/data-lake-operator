# Ingresses for the local DataPlatform on kind (nginx + mkcert wildcard).
# Applied by `make kind-up`. Backends exist after `make run` and applying
# config/samples/dataplatform_v1alpha1_local.yaml.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - keycloak.data-platform.local
    secretName: data-platform-tls
  rules:
  - host: keycloak.data-platform.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
---

name: Publish Helm Chart

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'deploy/**'
      - 'config/crd/**'
      - 'config/rbac/**'
      - 'hack/sync-helm-manifests.sh'
      - '.github/workflows/release-chart.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Charts are pushed under a charts/ prefix so they sit alongside, rather than
  # collide with, the operator image package of the same name.
  CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts
  CHART_DIR: deploy/data-lake-operator

jobs:
  chart:
    name: Lint, package and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # The chart's CRD and RBAC templates are generated from config/crd/bases
      # and config/rbac/role.yaml. If someone edits the API or the RBAC markers
      # without re-running the sync, the chart would ship a stale schema or
      # stale permissions, so fail loudly instead of publishing it.
      - name: Verify generated chart templates are in sync
        run: |
          # Compare content directly rather than via git, which reports no diff
          # for a file that is untracked.
          cp -r "${CHART_DIR}" "${RUNNER_TEMP}/chart-expected"
          ./hack/sync-helm-manifests.sh config/crd/bases config/rbac/role.yaml "${RUNNER_TEMP}/chart-expected"
          for f in templates/crds.yaml templates/_manager-rules.tpl; do
            if ! diff -u "${CHART_DIR}/${f}" "${RUNNER_TEMP}/chart-expected/${f}"; then
              echo "::error::${f} is out of date. Run 'make helm-sync' and commit the result."
              exit 1
            fi
          done

      - name: Lint chart
        run: helm lint "${CHART_DIR}"

      - name: Render chart
        run: helm template data-lake-operator "${CHART_DIR}" > /dev/null

      # Tags drive both the chart version and the operator image tag, so the
      # chart always points at the image built from the same commit.
      - name: Determine chart version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # Untagged runs get a throwaway version; they are never published.
            version="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Chart version: ${version}"

      - name: Package chart
        run: |
          mkdir -p dist
          helm package "${CHART_DIR}" \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist

      - name: Upload chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "${REGISTRY}" --username "${{ github.actor }}" --password-stdin

      - name: Push chart
        if: github.ref_type == 'tag'
        id: push
        run: |
          chart="dist/data-lake-operator-${{ steps.version.outputs.version }}.tgz"
          helm push "${chart}" "oci://${CHART_REPO}" 2>&1 | tee push.log
          digest="$(grep -oE 'sha256:[a-f0-9]{64}' push.log | head -1)"
          if [ -z "${digest}" ]; then
            echo "::error::Could not determine pushed chart digest"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest chart provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHART_REPO }}/data-lake-operator
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
